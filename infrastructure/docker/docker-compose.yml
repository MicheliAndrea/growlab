name: growlab

services:
  growlab-web:
    build:
      context: ../..
      dockerfile: apps/web/Dockerfile
    image: growlab-web:local
    container_name: growlab-web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-GrowLab}
    ports:
      - "${GROWLAB_LAN_BIND:-127.0.0.1}:3000:3000"
    depends_on:
      - growlab-api
    networks:
      - growlab
    restart: unless-stopped

  growlab-api:
    build:
      context: ../..
      dockerfile: apps/api/Dockerfile
    image: growlab-api:local
    container_name: growlab-api
    environment:
      GROWLAB_API_ADDR: ${GROWLAB_API_ADDR:-:8080}
      GROWLAB_PUBLIC_API_URL: ${GROWLAB_PUBLIC_API_URL:-http://localhost:8080}
      GROWLAB_CORS_ORIGINS: ${GROWLAB_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      GROWLAB_DB_HOST: ${GROWLAB_DB_HOST:-db-host}
      GROWLAB_DB_PORT: ${GROWLAB_DB_PORT:-5432}
      GROWLAB_DB_NAME: ${GROWLAB_DB_NAME:-growlab}
      GROWLAB_DB_USER: ${GROWLAB_DB_USER:-growlab}
      GROWLAB_DB_PASSWORD: ${GROWLAB_DB_PASSWORD:-change-me}
      GROWLAB_DB_SSLMODE: ${GROWLAB_DB_SSLMODE:-disable}
      GROWLAB_REDIS_ADDR: ${GROWLAB_REDIS_ADDR:-growlab-redis:6379}
      GROWLAB_IMAGE_STORAGE_PATH: ${GROWLAB_IMAGE_STORAGE_PATH:-/data/images}
      GROWLAB_IMAGE_UPLOAD_MAX_BYTES: ${GROWLAB_IMAGE_UPLOAD_MAX_BYTES:-15728640}
      GROWLAB_FIRMWARE_STORAGE_PATH: ${GROWLAB_FIRMWARE_STORAGE_PATH:-/data/firmware}
      GROWLAB_FIRMWARE_UPLOAD_MAX_BYTES: ${GROWLAB_FIRMWARE_UPLOAD_MAX_BYTES:-33554432}
      GROWLAB_SHELLY_TIMEOUT: ${GROWLAB_SHELLY_TIMEOUT:-3s}
      GROWLAB_FEATURE_AUTH: ${GROWLAB_FEATURE_AUTH:-false}
      GROWLAB_FEATURE_AI: ${GROWLAB_FEATURE_AI:-false}
      GROWLAB_FEATURE_IRRIGATION_MANUAL: ${GROWLAB_FEATURE_IRRIGATION_MANUAL:-false}
      GROWLAB_FEATURE_IRRIGATION_AUTOMATION: ${GROWLAB_FEATURE_IRRIGATION_AUTOMATION:-false}
      GROWLAB_FEATURE_SHELLY_LIGHTING: ${GROWLAB_FEATURE_SHELLY_LIGHTING:-true}
      GROWLAB_FEATURE_OTA: ${GROWLAB_FEATURE_OTA:-true}
    ports:
      - "${GROWLAB_LAN_BIND:-127.0.0.1}:8080:8080"
    volumes:
      - growlab_images:/data/images
      - growlab_firmware:/data/firmware
    depends_on:
      - growlab-redis
    networks:
      - growlab
    restart: unless-stopped

  growlab-worker:
    build:
      context: ../..
      dockerfile: workers/growlab-worker/Dockerfile
    image: growlab-worker:local
    container_name: growlab-worker
    environment:
      GROWLAB_WORKER_METRICS_ADDR: ${GROWLAB_WORKER_METRICS_ADDR:-:9091}
      GROWLAB_DB_HOST: ${GROWLAB_DB_HOST:-db-host}
      GROWLAB_DB_PORT: ${GROWLAB_DB_PORT:-5432}
      GROWLAB_DB_NAME: ${GROWLAB_DB_NAME:-growlab}
      GROWLAB_DB_USER: ${GROWLAB_DB_USER:-growlab}
      GROWLAB_DB_PASSWORD: ${GROWLAB_DB_PASSWORD:-change-me}
      GROWLAB_DB_SSLMODE: ${GROWLAB_DB_SSLMODE:-disable}
      GROWLAB_REDIS_ADDR: ${GROWLAB_REDIS_ADDR:-growlab-redis:6379}
      GROWLAB_MQTT_BROKER: ${GROWLAB_MQTT_BROKER:-tcp://growlab-emqx:1883}
      GROWLAB_MQTT_CLIENT_ID: ${GROWLAB_MQTT_CLIENT_ID:-growlab-worker}
      GROWLAB_MQTT_USERNAME: ${GROWLAB_MQTT_USERNAME:-growlab}
      GROWLAB_MQTT_PASSWORD: ${GROWLAB_MQTT_PASSWORD:-change-me}
      GROWLAB_IMAGE_STORAGE_PATH: ${GROWLAB_IMAGE_STORAGE_PATH:-/data/images}
      GROWLAB_FIRMWARE_STORAGE_PATH: ${GROWLAB_FIRMWARE_STORAGE_PATH:-/data/firmware}
      GROWLAB_FEATURE_AUTH: ${GROWLAB_FEATURE_AUTH:-false}
      GROWLAB_FEATURE_AI: ${GROWLAB_FEATURE_AI:-false}
      GROWLAB_FEATURE_IRRIGATION_MANUAL: ${GROWLAB_FEATURE_IRRIGATION_MANUAL:-false}
      GROWLAB_FEATURE_IRRIGATION_AUTOMATION: ${GROWLAB_FEATURE_IRRIGATION_AUTOMATION:-false}
      GROWLAB_FEATURE_SHELLY_LIGHTING: ${GROWLAB_FEATURE_SHELLY_LIGHTING:-true}
      GROWLAB_FEATURE_OTA: ${GROWLAB_FEATURE_OTA:-true}
    ports:
      - "${GROWLAB_LAN_BIND:-127.0.0.1}:9091:9091"
    volumes:
      - growlab_images:/data/images
      - growlab_firmware:/data/firmware
    depends_on:
      - growlab-emqx
      - growlab-redis
    networks:
      - growlab
    restart: unless-stopped

  growlab-emqx:
    image: emqx/emqx:5
    container_name: growlab-emqx
    environment:
      EMQX_NAME: growlab-emqx
      EMQX_HOST: growlab-emqx
      EMQX_DASHBOARD__DEFAULT_USERNAME: ${GROWLAB_EMQX_DASHBOARD_USERNAME:-admin}
      EMQX_DASHBOARD__DEFAULT_PASSWORD: ${GROWLAB_EMQX_DASHBOARD_PASSWORD:-change-me}
    ports:
      - "${GROWLAB_LAN_BIND:-127.0.0.1}:1883:1883"
      - "${GROWLAB_LAN_BIND:-127.0.0.1}:18083:18083"
    volumes:
      - growlab_emqx_data:/opt/emqx/data
      - growlab_emqx_log:/opt/emqx/log
    networks:
      - growlab
    restart: unless-stopped

  growlab-redis:
    image: redis:7-alpine
    container_name: growlab-redis
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - growlab_redis:/data
    networks:
      - growlab
    restart: unless-stopped

  growlab-ollama:
    image: ollama/ollama:latest
    container_name: growlab-ollama
    profiles:
      - ai
    volumes:
      - growlab_ollama:/root/.ollama
    networks:
      - growlab
    restart: unless-stopped

networks:
  growlab:
    name: growlab

volumes:
  growlab_images:
    name: growlab_images
  growlab_firmware:
    name: growlab_firmware
  growlab_redis:
    name: growlab_redis
  growlab_emqx_data:
    name: growlab_emqx_data
  growlab_emqx_log:
    name: growlab_emqx_log
  growlab_ollama:
    name: growlab_ollama
