components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"

  schemas:
    JsonObject:
      type: object
      additionalProperties: true

    HealthResponse:
      type: object
      required: [status, service, time]
      properties:
        status:
          type: string
          enum: [ok]
        service:
          type: string
          example: growlab-api
        time:
          type: string
          format: date-time

    ErrorResponse:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
        details:
          $ref: "#/components/schemas/JsonObject"

    Zone:
      type: object
      required:
        [id, growAreaId, name, slug, environmentType, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        growAreaId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        environmentType:
          type: string
          example: indoor
        metadata:
          $ref: "#/components/schemas/JsonObject"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ZoneCreateRequest:
      type: object
      required: [growAreaId, name, slug]
      properties:
        growAreaId:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        environmentType:
          type: string
          default: indoor
        metadata:
          $ref: "#/components/schemas/JsonObject"

    ZoneUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/ZoneCreateRequest"

    ZoneProfile:
      type: object
      required: [id, zoneId, name, isActive, targetConfig, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
        name:
          type: string
        isActive:
          type: boolean
        targetConfig:
          $ref: "#/components/schemas/JsonObject"
        metadata:
          $ref: "#/components/schemas/JsonObject"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    ZoneProfileCreateRequest:
      type: object
      required: [name, targetConfig]
      properties:
        name:
          type: string
        isActive:
          type: boolean
          default: false
        targetConfig:
          $ref: "#/components/schemas/JsonObject"
        metadata:
          $ref: "#/components/schemas/JsonObject"

    PlantHealthStatus:
      type: string
      enum: [healthy, watch, stressed, critical, dormant, dead]

    Plant:
      type: object
      required: [id, name, status, currentHealthStatus, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
          nullable: true
        speciesId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        code:
          type: string
          nullable: true
        status:
          type: string
          example: active
        currentHealthStatus:
          $ref: "#/components/schemas/PlantHealthStatus"
        plantedAt:
          type: string
          format: date
          nullable: true
        acquiredAt:
          type: string
          format: date
          nullable: true
        metadata:
          $ref: "#/components/schemas/JsonObject"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlantCreateRequest:
      type: object
      required: [name]
      properties:
        zoneId:
          type: string
          format: uuid
          nullable: true
        speciesId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
        code:
          type: string
          nullable: true
        currentHealthStatus:
          $ref: "#/components/schemas/PlantHealthStatus"
        plantedAt:
          type: string
          format: date
          nullable: true
        acquiredAt:
          type: string
          format: date
          nullable: true
        metadata:
          $ref: "#/components/schemas/JsonObject"

    PlantUpdateRequest:
      allOf:
        - $ref: "#/components/schemas/PlantCreateRequest"

    PlantTimelineItem:
      type: object
      required: [id, type, title, occurredAt]
      properties:
        id:
          type: string
          format: uuid
        type:
          type: string
          enum: [event, image, task, health_status]
        title:
          type: string
        description:
          type: string
          nullable: true
        occurredAt:
          type: string
          format: date-time
        metadata:
          $ref: "#/components/schemas/JsonObject"

    PlantEvent:
      type: object
      required: [id, plantId, eventType, occurredAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        plantId:
          type: string
          format: uuid
        eventType:
          type: string
          example: pruning
        occurredAt:
          type: string
          format: date-time
        notes:
          type: string
          nullable: true
        metadata:
          $ref: "#/components/schemas/JsonObject"
        createdAt:
          type: string
          format: date-time

    PlantEventCreateRequest:
      type: object
      required: [eventType]
      properties:
        eventType:
          type: string
          example: pruning
        occurredAt:
          type: string
          format: date-time
          nullable: true
        notes:
          type: string
          nullable: true
        metadata:
          $ref: "#/components/schemas/JsonObject"

    PlantImage:
      type: object
      required: [id, plantId, storagePath, uploadedAt]
      properties:
        id:
          type: string
          format: uuid
        plantId:
          type: string
          format: uuid
        zoneId:
          type: string
          format: uuid
          nullable: true
        storagePath:
          type: string
        originalFilename:
          type: string
          nullable: true
        contentType:
          type: string
          nullable: true
        sizeBytes:
          type: integer
          format: int64
          nullable: true
        checksumSha256:
          type: string
          nullable: true
        capturedAt:
          type: string
          format: date-time
          nullable: true
        growthStage:
          type: string
          nullable: true
        growthTracking:
          $ref: "#/components/schemas/JsonObject"
        tags:
          type: array
          items:
            type: string
        uploadedAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    PlantImageUploadRequest:
      type: object
      required: [file]
      properties:
        file:
          type: string
          format: binary
        capturedAt:
          type: string
          format: date-time
          nullable: true
        growthStage:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/JsonObject"

    PlantImageUpdateRequest:
      type: object
      properties:
        growthStage:
          type: string
          nullable: true
        growthTracking:
          $ref: "#/components/schemas/JsonObject"
        tags:
          type: array
          items:
            type: string
        metadata:
          $ref: "#/components/schemas/JsonObject"

    PlantTask:
      type: object
      required: [id, plantId, title, status, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        plantId:
          type: string
          format: uuid
        title:
          type: string
        description:
          type: string
          nullable: true
        status:
          type: string
          enum: [todo, done, skipped, cancelled]
        dueAt:
          type: string
          format: date-time
          nullable: true
        completedAt:
          type: string
          format: date-time
          nullable: true
        recurrenceConfig:
          $ref: "#/components/schemas/JsonObject"
        metadata:
          $ref: "#/components/schemas/JsonObject"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlantTaskCreateRequest:
      type: object
      required: [title]
      properties:
        title:
          type: string
        description:
          type: string
          nullable: true
        dueAt:
          type: string
          format: date-time
          nullable: true
        recurrenceConfig:
          $ref: "#/components/schemas/JsonObject"
        metadata:
          $ref: "#/components/schemas/JsonObject"

    PlantTaskUpdateRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [todo, done, skipped, cancelled]
        completedAt:
          type: string
          format: date-time
          nullable: true
        metadata:
          $ref: "#/components/schemas/JsonObject"

    PlantFamily:
      type: object
      required: [id, scientificName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        commonName:
          type: string
          nullable: true
        scientificName:
          type: string
        metadata:
          $ref: "#/components/schemas/JsonObject"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlantCategory:
      type: object
      required: [id, name, slug, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        metadata:
          $ref: "#/components/schemas/JsonObject"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    PlantSpecies:
      type: object
      required: [id, scientificName, createdAt, updatedAt]
      properties:
        id:
          type: string
          format: uuid
        familyId:
          type: string
          format: uuid
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        commonName:
          type: string
          nullable: true
        scientificName:
          type: string
        cultivar:
          type: string
          nullable: true
        metadata:
          $ref: "#/components/schemas/JsonObject"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SystemSeverity:
      type: string
      enum: [info, warning, error, critical]

    SystemEvent:
      type: object
      required:
        [id, eventType, severity, source, message, occurredAt, createdAt]
      properties:
        id:
          type: string
          format: uuid
        eventType:
          type: string
        severity:
          $ref: "#/components/schemas/SystemSeverity"
        source:
          type: string
        zoneId:
          type: string
          format: uuid
          nullable: true
        plantId:
          type: string
          format: uuid
          nullable: true
        deviceId:
          type: string
          format: uuid
          nullable: true
        alertId:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
        metadata:
          $ref: "#/components/schemas/JsonObject"
        occurredAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    SystemEventCreateRequest:
      type: object
      required: [eventType, source, message]
      properties:
        eventType:
          type: string
        severity:
          $ref: "#/components/schemas/SystemSeverity"
        source:
          type: string
        zoneId:
          type: string
          format: uuid
          nullable: true
        plantId:
          type: string
          format: uuid
          nullable: true
        deviceId:
          type: string
          format: uuid
          nullable: true
        alertId:
          type: string
          format: uuid
          nullable: true
        message:
          type: string
        metadata:
          $ref: "#/components/schemas/JsonObject"
        occurredAt:
          type: string
          format: date-time
          nullable: true

    SystemAlertStatus:
      type: string
      enum: [active, acknowledged, resolved]

    SystemAlert:
      type: object
      required:
        [
          id,
          severity,
          source,
          title,
          message,
          status,
          raisedAt,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        severity:
          $ref: "#/components/schemas/SystemSeverity"
        source:
          type: string
        title:
          type: string
        message:
          type: string
        status:
          $ref: "#/components/schemas/SystemAlertStatus"
        raisedAt:
          type: string
          format: date-time
        acknowledgedAt:
          type: string
          format: date-time
          nullable: true
        acknowledgedBy:
          type: string
          nullable: true
        resolvedAt:
          type: string
          format: date-time
          nullable: true
        resolvedBy:
          type: string
          nullable: true
        metadata:
          $ref: "#/components/schemas/JsonObject"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    SystemAlertCreateRequest:
      type: object
      required: [severity, source, title, message]
      properties:
        severity:
          $ref: "#/components/schemas/SystemSeverity"
        source:
          type: string
        title:
          type: string
        message:
          type: string
        metadata:
          $ref: "#/components/schemas/JsonObject"

    SystemAlertTransitionRequest:
      type: object
      properties:
        changedBy:
          type: string
          nullable: true

    AutomationRule:
      type: object
      required:
        [
          id,
          name,
          slug,
          enabled,
          severity,
          conditionConfig,
          actionConfig,
          metadata,
          triggerMode,
          schedulerCommit,
          cooldownSeconds,
          schedulerStatus,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
        severity:
          $ref: "#/components/schemas/SystemSeverity"
        conditionConfig:
          $ref: "#/components/schemas/JsonObject"
        actionConfig:
          $ref: "#/components/schemas/JsonObject"
        metadata:
          $ref: "#/components/schemas/JsonObject"
        triggerMode:
          type: string
          enum: [manual, scheduled]
        scheduleIntervalSeconds:
          type: integer
          nullable: true
          minimum: 30
          maximum: 86400
        schedulerCommit:
          type: boolean
        cooldownSeconds:
          type: integer
          minimum: 0
          maximum: 604800
        nextRunAt:
          type: string
          format: date-time
          nullable: true
        lastSchedulerRunAt:
          type: string
          format: date-time
          nullable: true
        schedulerStatus:
          type: string
          enum: [idle, due, running, matched, not_matched, failed]
        schedulerError:
          type: string
          nullable: true
        lastEvaluatedAt:
          type: string
          format: date-time
          nullable: true
        lastMatchedAt:
          type: string
          format: date-time
          nullable: true
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    AutomationRuleCreateRequest:
      type: object
      required: [name, conditionConfig, actionConfig]
      properties:
        name:
          type: string
        slug:
          type: string
        description:
          type: string
          nullable: true
        enabled:
          type: boolean
          default: true
        severity:
          $ref: "#/components/schemas/SystemSeverity"
        conditionConfig:
          $ref: "#/components/schemas/JsonObject"
        actionConfig:
          $ref: "#/components/schemas/JsonObject"
        metadata:
          $ref: "#/components/schemas/JsonObject"
        triggerMode:
          type: string
          enum: [manual, scheduled]
          default: manual
        scheduleIntervalSeconds:
          type: integer
          nullable: true
          minimum: 30
          maximum: 86400
        schedulerCommit:
          type: boolean
          default: false
        cooldownSeconds:
          type: integer
