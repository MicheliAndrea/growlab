openapi: 3.0.3
info:
  title: GrowLab API
  version: 0.1.0
  description: Local GrowLab REST API source of truth.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Health
  - name: Zones
  - name: Plants
  - name: Wiki
  - name: System
  - name: Devices
  - name: Lighting
  - name: Firmware
  - name: Irrigation
paths:
  /api/health:
    get:
      tags: [Health]
      operationId: getHealth
      responses:
        "200":
          description: API health state.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /api/zones:
    get:
      tags: [Zones]
      operationId: listZones
      responses:
        "200":
          description: Zones list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Zone"
    post:
      tags: [Zones]
      operationId: createZone
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneCreateRequest"
      responses:
        "201":
          description: Zone created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/zones/{id}:
    get:
      tags: [Zones]
      operationId: getZone
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Zone detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Zones]
      operationId: updateZone
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneUpdateRequest"
      responses:
        "200":
          description: Zone updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Zone"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Zones]
      operationId: deleteZone
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Zone deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/zones/{id}/profiles:
    get:
      tags: [Zones]
      operationId: listZoneProfiles
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Target profiles for a zone.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ZoneProfile"
    post:
      tags: [Zones]
      operationId: createZoneProfile
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZoneProfileCreateRequest"
      responses:
        "201":
          description: Zone profile created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneProfile"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/zones/{id}/profiles/{profileId}/activate:
    post:
      tags: [Zones]
      operationId: activateZoneProfile
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: profileId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Zone profile activated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZoneProfile"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plants:
    get:
      tags: [Plants]
      operationId: listPlants
      parameters:
        - name: zoneId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Plants list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Plant"
    post:
      tags: [Plants]
      operationId: createPlant
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantCreateRequest"
      responses:
        "201":
          description: Plant created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/plants/{id}:
    get:
      tags: [Plants]
      operationId: getPlant
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Plant detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "404":
          $ref: "#/components/responses/NotFound"
    put:
      tags: [Plants]
      operationId: updatePlant
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantUpdateRequest"
      responses:
        "200":
          description: Plant updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Plant"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Plants]
      operationId: deletePlant
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Plant deleted.
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plants/{id}/timeline:
    get:
      tags: [Plants]
      operationId: getPlantTimeline
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Plant timeline.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlantTimelineItem"

  /api/plants/{id}/events:
    get:
      tags: [Plants]
      operationId: listPlantEvents
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Plant events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlantEvent"
    post:
      tags: [Plants]
      operationId: createPlantEvent
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantEventCreateRequest"
      responses:
        "201":
          description: Plant event created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantEvent"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/plants/{id}/images:
    get:
      tags: [Plants]
      operationId: listPlantImages
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Plant image metadata list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlantImage"
    post:
      tags: [Plants]
      operationId: uploadPlantImage
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/PlantImageUploadRequest"
      responses:
        "201":
          description: Plant image uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantImage"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/images/{id}:
    patch:
      tags: [Plants]
      operationId: updatePlantImage
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantImageUpdateRequest"
      responses:
        "200":
          description: Plant image metadata updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantImage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/images/{id}/file:
    get:
      tags: [Plants]
      operationId: getPlantImageFile
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Stored plant image file.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          $ref: "#/components/responses/NotFound"

  /api/plants/{id}/tasks:
    get:
      tags: [Plants]
      operationId: listPlantTasks
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Manual checklist tasks for a plant.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlantTask"
    post:
      tags: [Plants]
      operationId: createPlantTask
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantTaskCreateRequest"
      responses:
        "201":
          description: Plant task created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantTask"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/plants/{id}/tasks/{taskId}:
    patch:
      tags: [Plants]
      operationId: updatePlantTask
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: taskId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlantTaskUpdateRequest"
      responses:
        "200":
          description: Plant task updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlantTask"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/wiki/plant-families:
    get:
      tags: [Wiki]
      operationId: listPlantFamilies
      responses:
        "200":
          description: Plant families from the local wiki catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlantFamily"

  /api/wiki/plant-categories:
    get:
      tags: [Wiki]
      operationId: listPlantCategories
      responses:
        "200":
          description: Plant categories from the local wiki catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlantCategory"

  /api/wiki/plant-species:
    get:
      tags: [Wiki]
      operationId: listPlantSpecies
      responses:
        "200":
          description: Plant species from the local wiki catalog.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlantSpecies"

  /api/system/events:
    get:
      tags: [System]
      operationId: listSystemEvents
      responses:
        "200":
          description: Global system events.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemEvent"
    post:
      tags: [System]
      operationId: createSystemEvent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemEventCreateRequest"
      responses:
        "201":
          description: System event created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemEvent"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/system/alerts:
    get:
      tags: [System]
      operationId: listSystemAlerts
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/SystemAlertStatus"
      responses:
        "200":
          description: System alerts.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SystemAlert"
    post:
      tags: [System]
      operationId: createSystemAlert
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemAlertCreateRequest"
      responses:
        "201":
          description: System alert created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemAlert"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/system/alerts/{id}/acknowledge:
    post:
      tags: [System]
      operationId: acknowledgeSystemAlert
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemAlertTransitionRequest"
      responses:
        "200":
          description: Alert acknowledged.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemAlert"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/system/alerts/{id}/resolve:
    post:
      tags: [System]
      operationId: resolveSystemAlert
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SystemAlertTransitionRequest"
      responses:
        "200":
          description: Alert resolved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemAlert"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/automation/rules:
    get:
      tags: [Automation]
      operationId: listAutomationRules
      responses:
        "200":
          description: Automation rules.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationRule"
    post:
      tags: [Automation]
      operationId: createAutomationRule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationRuleCreateRequest"
      responses:
        "201":
          description: Automation rule created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRule"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/automation/context:
    get:
      tags: [Automation]
      operationId: getAutomationContext
      responses:
        "200":
          description: Current automatic evaluation context.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JsonObject"

  /api/automation/scheduler/run:
    post:
      tags: [Automation]
      operationId: runAutomationScheduler
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
      responses:
        "200":
          description: Scheduled automation rules evaluated.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationSchedulerRunResult"

  /api/automation/rules/{id}/evaluations:
    get:
      tags: [Automation]
      operationId: listAutomationRuleEvaluations
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Automation rule evaluation history.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AutomationRuleEvaluation"

  /api/automation/rules/{id}/evaluate:
    post:
      tags: [Automation]
      operationId: evaluateAutomationRule
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationRuleEvaluationRequest"
      responses:
        "201":
          description: Automation rule evaluated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationRuleEvaluation"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/devices:
    get:
      tags: [Devices]
      operationId: listDevices
      responses:
        "200":
          description: Devices list.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"

  /api/devices/{id}:
    get:
      tags: [Devices]
      operationId: getDevice
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Device detail.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/devices/{id}/capabilities:
    get:
      tags: [Devices]
      operationId: listDeviceCapabilities
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Device capabilities.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceCapability"
    post:
      tags: [Devices]
      operationId: createDeviceCapability
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCapabilityCreateRequest"
      responses:
        "201":
          description: Device capability created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCapability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/devices/{id}/capabilities/{capabilityId}:
    patch:
      tags: [Devices]
      operationId: updateDeviceCapability
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: capabilityId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceCapabilityUpdateRequest"
      responses:
        "200":
          description: Device capability updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceCapability"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/devices/{id}/provisioning:
    get:
      tags: [Devices]
      operationId: getDeviceProvisioning
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Device provisioning metadata.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceProvisioningConfig"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Devices]
      operationId: createDeviceProvisioning
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceProvisioningCreateRequest"
      responses:
        "201":
          description: Device provisioning metadata created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceProvisioningConfig"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/devices/{id}/provisioning/{provisioningId}:
    patch:
      tags: [Devices]
      operationId: updateDeviceProvisioning
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: provisioningId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceProvisioningUpdateRequest"
      responses:
        "200":
          description: Device provisioning metadata updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceProvisioningConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/provisioning/claim:
    get:
      tags: [Devices]
      operationId: previewDeviceProvisioningClaim
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Device provisioning claim preview.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceProvisioningConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [Devices]
      operationId: claimDeviceProvisioning
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceProvisioningClaimRequest"
      responses:
        "200":
          description: Device provisioning claimed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceProvisioningConfig"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/telemetry/latest:
    get:
      tags: [Telemetry]
      operationId: listLatestSensorReadings
      parameters:
        - name: zoneId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Latest reading per enabled sensor.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/LatestSensorReading"

  /api/sensors/{id}/readings:
    get:
      tags: [Telemetry]
      operationId: listSensorReadings
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: hours
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 720
            default: 24
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 120
      responses:
        "200":
          description: Sensor readings for the requested lookback window.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SensorReading"

  /api/sensors/{id}/calibrations:
    get:
      tags: [Devices]
      operationId: listSensorCalibrations
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Sensor calibrations.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SensorCalibration"
    post:
      tags: [Devices]
      operationId: createSensorCalibration
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorCalibrationCreateRequest"
      responses:
        "201":
          description: Sensor calibration created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorCalibration"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/sensors/{id}/calibrations/{calibrationId}:
    patch:
      tags: [Devices]
      operationId: updateSensorCalibration
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: calibrationId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SensorCalibrationUpdateRequest"
      responses:
        "200":
          description: Sensor calibration updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SensorCalibration"
        "400":
          $ref: "#/components/responses/BadRequest"
